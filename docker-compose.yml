services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: realestate
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # Host port 5433 -> container port 5432, to avoid clashing with a
      # PostgreSQL already running on the host. The backend still connects via
      # the internal Docker network on 5432, so this only affects tools you
      # run on the host (e.g. `psql -h localhost -p 5433`).
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d realestate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      # Host port 18000 -> container port 8000. Using a high, unusual host port
      # because 8000/8001 are held by other Docker containers on this machine.
      - "18000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/realestate
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONPATH: /app
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A backend.workers.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/realestate
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONPATH: /app
    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis
      - postgres

  beat:
    build:
      context: ./backend
    command: celery -A backend.workers.celery_app beat --loglevel=info
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONPATH: /app
    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    env_file: .env
    environment:
      VITE_API_BASE_URL: http://localhost:18000
      VITE_WS_BASE_URL: ws://localhost:18000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
